name: Container CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source checks
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lockfiles
        run: pnpm check:lockfiles

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run TypeScript integration tests
        run: pnpm test:integration

      - name: Run Python tests
        run: pnpm test:python
        env:
          PYTHON: python3

  image:
    name: Docker contract (${{ matrix.platform }})
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Select Dockerfile
        id: image
        env:
          DISABLE_PREBUILT: ${{ vars.BASTION_DISABLE_PREBUILT_TOOLS }}
          TOOLS_IMAGE: ${{ vars.BASTION_TOOLS_IMAGE }}
        run: |
          if [ "$DISABLE_PREBUILT" = "true" ] || [ -z "$TOOLS_IMAGE" ]; then
            echo "target=runner-legacy" >> "$GITHUB_OUTPUT"
            echo "BASTION_DISABLE_PREBUILT_TOOLS is enabled or BASTION_TOOLS_IMAGE is unset; using the legacy in-image Go build"
          else
            if [[ ! "$TOOLS_IMAGE" =~ ^ghcr\.io/endurancelabs/journal-bastion-tools@sha256:[0-9a-f]{64}$ ]]; then
              echo "BASTION_TOOLS_IMAGE must be a full journal-bastion-tools digest reference" >&2
              exit 1
            fi
            echo "target=runner-prebuilt" >> "$GITHUB_OUTPUT"
            echo "Using pinned prebuilt Go tools image: $TOOLS_IMAGE"
          fi

      - name: Build native image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ steps.image.outputs.target }}
          load: true
          platforms: ${{ matrix.platform }}
          tags: journal-bastion:ci-${{ matrix.arch }}
          build-args: |
            TOOLS_IMAGE=${{ vars.BASTION_TOOLS_IMAGE }}
          cache-from: type=gha,scope=container-ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-ci-${{ matrix.arch }}

      - name: Run Docker contract
        run: testing/docker/run-contract.sh
        env:
          BUILD_IMAGE: "0"
          IMAGE: journal-bastion:ci-${{ matrix.arch }}
