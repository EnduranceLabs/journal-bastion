name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"

permissions: {}

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/endurancelabs/journal-bastion

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag and versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be v<major>.<minor>.<patch>: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          python_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' clients/python/pyproject.toml)"
          if [ "$version" != "$package_version" ] || [ "$version" != "$python_version" ]; then
            echo "Tag $version does not match package=$package_version python=$python_version" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit is not reachable from origin/main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for immutable-tag check
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable version tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists and will not be overwritten" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lockfiles
        run: pnpm check:lockfiles

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run TypeScript integration tests
        run: pnpm test:integration

      - name: Run Python tests
        run: pnpm test:python
        env:
          PYTHON: python3

  approve:
    name: Approve publication
    needs: validate
    runs-on: ubuntu-24.04
    environment: container-release
    permissions: {}
    steps:
      - name: Record release approval
        run: echo "Publishing journal-bastion ${{ needs.validate.outputs.version }}"

  build:
    name: Build and scan (${{ matrix.platform }})
    needs:
      - validate
      - approve
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-release-${{ matrix.arch }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          hide-progress: true

      - name: Save image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  verify-digest:
    name: Verify anonymous digest (${{ matrix.platform }})
    needs:
      - validate
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests

      - name: Pull anonymously and run Docker contract
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          digest_file="$(find /tmp/digests -type f -maxdepth 1 | head -n 1)"
          digest="sha256:$(basename "$digest_file")"
          docker pull --platform "${{ matrix.platform }}" "$IMAGE@$digest"
          docker tag "$IMAGE@$digest" journal-bastion:release-${{ matrix.arch }}
          BUILD_IMAGE=0 IMAGE=journal-bastion:release-${{ matrix.arch }} \
            EXPECTED_VERSION="$EXPECTED_VERSION" testing/docker/run-contract.sh

  manifest:
    name: Publish multi-platform manifest
    needs:
      - validate
      - verify-digest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download native digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and release tags
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/digests -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected two architecture digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          refs=()
          for digest_file in "${digest_files[@]}"; do
            refs+=("$IMAGE@sha256:$(basename "$digest_file")")
          done

          minor="${VERSION%.*}"
          short_sha="${GITHUB_SHA:0:12}"
          docker buildx imagetools create \
            --tag "$IMAGE:$VERSION" \
            --tag "$IMAGE:$minor" \
            --tag "$IMAGE:latest" \
            --tag "$IMAGE:sha-$short_sha" \
            "${refs[@]}"

          docker buildx imagetools inspect --raw "$IMAGE:$VERSION" > /tmp/manifest.json
          digest="sha256:$(sha256sum /tmp/manifest.json | awk '{print $1}')"
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  verify-release:
    name: Verify public release (${{ matrix.platform }})
    needs:
      - validate
      - manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull release tag anonymously
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          docker pull --platform "${{ matrix.platform }}" "$IMAGE:$VERSION"
          BUILD_IMAGE=0 IMAGE="$IMAGE:$VERSION" EXPECTED_VERSION="$VERSION" \
            testing/docker/run-contract.sh

  release:
    name: Create GitHub release
    needs:
      - validate
      - manifest
      - verify-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release notes
        shell: bash
        env:
          DIGEST: ${{ needs.manifest.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          Multi-platform Journal Bastion container for Linux amd64 and arm64.

          Container image:

          \`$IMAGE:$VERSION\`

          Immutable digest:

          \`$IMAGE@$DIGEST\`

          Verify its provenance with:

          \`gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"\`
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Journal Bastion $VERSION" \
            --notes-file /tmp/release-notes.md
