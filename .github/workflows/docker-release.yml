name: Publish container image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: container-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/endurancelabs/journal-bastion
  TOOLS_IMAGE: ghcr.io/endurancelabs/journal-bastion-tools

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_tag: ${{ steps.version.outputs.image_tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.15.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag and versions
        id: version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          python_version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' clients/python/pyproject.toml)"

          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF_NAME" != "main" ]; then
              echo "Release canary must run from main: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            version="$package_version"
            image_tag="canary-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          else
            version="${GITHUB_REF_NAME#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release tag must be v<major>.<minor>.<patch>: $GITHUB_REF_NAME" >&2
              exit 1
            fi
            image_tag="$version"
          fi

          if [ "$version" != "$package_version" ] || [ "$version" != "$python_version" ]; then
            echo "Tag $version does not match package=$package_version python=$python_version" >&2
            exit 1
          fi

          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit is not reachable from origin/main" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image_tag=$image_tag" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR for immutable-tag check
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable version tag
        if: github.event_name != 'workflow_dispatch'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "$IMAGE:$VERSION already exists and will not be overwritten" >&2
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check lockfiles
        run: pnpm check:lockfiles

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Run unit tests
        run: pnpm test

      - name: Run TypeScript integration tests
        run: pnpm test:integration

      - name: Run Python tests
        run: pnpm test:python
        env:
          PYTHON: python3

  approve:
    name: Approve publication
    needs: validate
    runs-on: ubuntu-24.04
    environment: container-release
    permissions: {}
    steps:
      - name: Record release approval
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Approving journal-bastion release canary ${{ needs.validate.outputs.image_tag }}"
          else
            echo "Publishing journal-bastion ${{ needs.validate.outputs.version }}"
          fi

  resolve-tools:
    name: Resolve Go tools image
    needs:
      - validate
      - approve
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      fingerprint: ${{ steps.resolve.outputs.fingerprint }}
      mode: ${{ steps.resolve.outputs.mode }}
      needs_build: ${{ steps.resolve.outputs.needs_build }}
      reference: ${{ steps.resolve.outputs.reference }}
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tools image
        id: resolve
        shell: bash
        env:
          DISABLE_PREBUILT: ${{ vars.BASTION_DISABLE_PREBUILT_TOOLS }}
          OVERRIDE_IMAGE: ${{ vars.BASTION_TOOLS_IMAGE }}
        run: |
          set -euo pipefail

          if [ "$DISABLE_PREBUILT" = "true" ]; then
            echo "mode=legacy" >> "$GITHUB_OUTPUT"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "reference=" >> "$GITHUB_OUTPUT"
            echo "fingerprint=disabled" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "BASTION_DISABLE_PREBUILT_TOOLS=true; using the legacy Go build"
            exit 0
          fi

          if [ -n "$OVERRIDE_IMAGE" ]; then
            if [[ ! "$OVERRIDE_IMAGE" =~ ^ghcr\.io/endurancelabs/journal-bastion-tools@sha256:[0-9a-f]{64}$ ]]; then
              echo "BASTION_TOOLS_IMAGE must be a full journal-bastion-tools digest reference" >&2
              exit 1
            fi
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "reference=$OVERRIDE_IMAGE" >> "$GITHUB_OUTPUT"
            echo "fingerprint=override" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "Using the BASTION_TOOLS_IMAGE digest override: $OVERRIDE_IMAGE"
            exit 0
          fi

          fingerprint="$(awk '/^FROM node:22-slim.* AS build$/{exit} {print}' packaging/docker/Dockerfile | sha256sum | cut -c1-12)"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$TOOLS_IMAGE:tools-canary-$fingerprint"
          else
            tag="$TOOLS_IMAGE:tools-$fingerprint"
          fi
          if digest="$(docker buildx imagetools inspect "$tag" --format '{{.Manifest.Digest}}' 2>/dev/null)" && \
             [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
            echo "needs_build=false" >> "$GITHUB_OUTPUT"
            echo "reference=$TOOLS_IMAGE@$digest" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Reusing existing tools image: $TOOLS_IMAGE@$digest"
          else
            echo "mode=prebuilt" >> "$GITHUB_OUTPUT"
            echo "needs_build=true" >> "$GITHUB_OUTPUT"
            echo "reference=" >> "$GITHUB_OUTPUT"
            echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "Tools image is missing; it will be built and verified once"
          fi

  build-tools:
    name: Build and scan Go tools (${{ matrix.platform }})
    needs: resolve-tools
    if: needs.resolve-tools.outputs.needs_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push tools image by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: tools
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.TOOLS_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            TOOLS_IMAGE_VERSION=tools-${{ needs.resolve-tools.outputs.fingerprint }}
            VCS_REF=${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=tools-${{ needs.resolve-tools.outputs.fingerprint }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-tools-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-tools-${{ matrix.arch }}

      - name: Scan tools image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.TOOLS_IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          hide-progress: true

      - name: Save tools image digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/tool-digests
          touch "/tmp/tool-digests/${DIGEST#sha256:}"

      - name: Upload tools image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-digest-${{ matrix.arch }}
          path: /tmp/tool-digests/*
          if-no-files-found: error
          retention-days: 1

  publish-tools:
    name: Publish Go tools manifest
    needs:
      - resolve-tools
      - build-tools
    if: needs.resolve-tools.outputs.needs_build == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      reference: ${{ steps.reference.outputs.reference }}
    steps:
      - name: Download tools image digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: tools-digest-*
          path: /tmp/tool-digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create tools manifest
        env:
          TOOLS_TAG: ${{ needs.resolve-tools.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/tool-digests -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected two architecture digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          refs=()
          for digest_file in "${digest_files[@]}"; do
            refs+=("$TOOLS_IMAGE@sha256:$(basename "$digest_file")")
          done
          docker buildx imagetools create --tag "$TOOLS_TAG" "${refs[@]}"

      - name: Record tools image digest
        id: reference
        env:
          TOOLS_TAG: ${{ needs.resolve-tools.outputs.tag }}
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$TOOLS_TAG" --format '{{.Manifest.Digest}}')"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Unexpected tools manifest digest: $digest" >&2
            exit 1
          fi
          reference="$TOOLS_IMAGE@$digest"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"
          echo "$reference" | tee tools-image-reference.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload tools image reference
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tools-image-reference
          path: tools-image-reference.txt
          if-no-files-found: error
          retention-days: 30

  select-tools:
    name: Select release tools path
    needs:
      - resolve-tools
      - publish-tools
    if: >-
      always() &&
      needs.resolve-tools.result == 'success' &&
      (needs.publish-tools.result == 'success' || needs.publish-tools.result == 'skipped')
    runs-on: ubuntu-24.04
    permissions: {}
    outputs:
      reference: ${{ steps.select.outputs.reference }}
      target: ${{ steps.select.outputs.target }}
    steps:
      - name: Select tools path
        id: select
        env:
          MODE: ${{ needs.resolve-tools.outputs.mode }}
          OVERRIDE_REFERENCE: ${{ needs.resolve-tools.outputs.reference }}
          PUBLISHED_REFERENCE: ${{ needs.publish-tools.outputs.reference }}
        run: |
          set -euo pipefail
          if [ "$MODE" = "legacy" ]; then
            echo "target=runner-legacy" >> "$GITHUB_OUTPUT"
            echo "reference=scratch" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          reference="$OVERRIDE_REFERENCE"
          if [ -z "$reference" ]; then
            reference="$PUBLISHED_REFERENCE"
          fi
          if [ -z "$reference" ]; then
            echo "No verified prebuilt tools image reference was produced" >&2
            exit 1
          fi
          echo "target=runner-prebuilt" >> "$GITHUB_OUTPUT"
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

  build:
    name: Build and scan (${{ matrix.platform }})
    needs:
      - validate
      - approve
      - select-tools
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: write
    env:
      DEPOT_PROJECT_ID: ${{ vars.DEPOT_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        if: env.DEPOT_PROJECT_ID == ''
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Set up Depot
        if: env.DEPOT_PROJECT_ID != ''
        uses: depot/setup-action@91bc8495a33ebfc504ffc89e5674379ccf23c29c # v1.7.2

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push native image by digest with Depot
        id: depot_build
        if: env.DEPOT_PROJECT_ID != ''
        uses: depot/build-push-action@98e78adca7817480b8185f474a400b451d74e287 # v1.18.0
        with:
          project: ${{ env.DEPOT_PROJECT_ID }}
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ needs.select-tools.outputs.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
            TOOLS_IMAGE=${{ needs.select-tools.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          buildx-fallback: false

      - name: Build and push native image by digest with Buildx
        id: buildx_build
        if: env.DEPOT_PROJECT_ID == ''
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          target: ${{ needs.select-tools.outputs.target }}
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          build-args: |
            IMAGE_VERSION=${{ needs.validate.outputs.version }}
            VCS_REF=${{ github.sha }}
            TOOLS_IMAGE=${{ needs.select-tools.outputs.reference }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
            org.opencontainers.image.licenses=MIT
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=container-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=container-release-${{ matrix.arch }}

      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.depot_build.outputs.digest || steps.buildx_build.outputs.digest }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          scanners: vuln
          severity: HIGH,CRITICAL
          hide-progress: true

      - name: Save image digest
        shell: bash
        env:
          DIGEST: ${{ steps.depot_build.outputs.digest || steps.buildx_build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  verify-digest:
    name: Verify anonymous digest (${{ matrix.platform }})
    needs:
      - validate
      - build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download native digest
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests

      - name: Pull anonymously and run Docker contract
        shell: bash
        env:
          EXPECTED_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          digest_file="$(find /tmp/digests -type f -maxdepth 1 | head -n 1)"
          digest="sha256:$(basename "$digest_file")"
          docker pull --platform "${{ matrix.platform }}" "$IMAGE@$digest"
          docker tag "$IMAGE@$digest" journal-bastion:release-${{ matrix.arch }}
          BUILD_IMAGE=0 IMAGE=journal-bastion:release-${{ matrix.arch }} \
            EXPECTED_VERSION="$EXPECTED_VERSION" testing/docker/run-contract.sh

  manifest:
    name: Publish multi-platform manifest
    needs:
      - validate
      - verify-digest
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - name: Download native digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest and release tags
        id: manifest
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
          CANARY: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          mapfile -t digest_files < <(find /tmp/digests -maxdepth 1 -type f | sort)
          if [ "${#digest_files[@]}" -ne 2 ]; then
            echo "Expected two architecture digests, found ${#digest_files[@]}" >&2
            exit 1
          fi

          refs=()
          for digest_file in "${digest_files[@]}"; do
            refs+=("$IMAGE@sha256:$(basename "$digest_file")")
          done

          if [ "$CANARY" = "true" ]; then
            docker buildx imagetools create \
              --tag "$IMAGE:$IMAGE_TAG" \
              "${refs[@]}"
          else
            minor="${VERSION%.*}"
            short_sha="${GITHUB_SHA:0:12}"
            docker buildx imagetools create \
              --tag "$IMAGE:$VERSION" \
              --tag "$IMAGE:$minor" \
              --tag "$IMAGE:latest" \
              --tag "$IMAGE:sha-$short_sha" \
              "${refs[@]}"
          fi

          docker buildx imagetools inspect --raw "$IMAGE:$IMAGE_TAG" > /tmp/manifest.json
          digest="sha256:$(sha256sum /tmp/manifest.json | awk '{print $1}')"
          docker buildx imagetools inspect "$IMAGE@$digest"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Attest the release manifest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

  verify-release:
    name: Verify public release (${{ matrix.platform }})
    needs:
      - validate
      - manifest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pull release tag anonymously
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          IMAGE_TAG: ${{ needs.validate.outputs.image_tag }}
        run: |
          docker pull --platform "${{ matrix.platform }}" "$IMAGE:$IMAGE_TAG"
          BUILD_IMAGE=0 IMAGE="$IMAGE:$IMAGE_TAG" EXPECTED_VERSION="$VERSION" \
            testing/docker/run-contract.sh

  release:
    name: Create GitHub release
    if: github.event_name != 'workflow_dispatch'
    needs:
      - validate
      - manifest
      - verify-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create release notes
        shell: bash
        env:
          DIGEST: ${{ needs.manifest.outputs.digest }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cat > /tmp/release-notes.md <<EOF
          Multi-platform Journal Bastion container for Linux amd64 and arm64.

          Container image:

          \`$IMAGE:$VERSION\`

          Immutable digest:

          \`$IMAGE@$DIGEST\`

          Verify its provenance with:

          \`gh attestation verify "oci://$IMAGE@$DIGEST" --repo "$GITHUB_REPOSITORY"\`
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "Journal Bastion $VERSION" \
            --notes-file /tmp/release-notes.md
